name: Deploy to Fly.io

on:
  push:
    branches: [main]
    # The landing page (docs/, served by GitHub Pages) and Markdown docs don't ship in the
    # bot image, so pushes that only touch them skip the Fly deploy. A push that also
    # changes code still deploys.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
