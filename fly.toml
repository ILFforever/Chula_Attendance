# fly.toml app configuration file generated for chula-attendance-bot on 2026-02-23T18:03:49+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'chula-attendance-bot'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  PYTHONUNBUFFERED = '1'
  DATA_DIR = '/data'
  # Max concurrent logins per platform (each platform has its own pool, so the
  # ceiling across both is double this).
  #
  # Do not raise this without re-running /benchms. RAM is not the limit —
  # measured cost is ~1.5 MB per ClassDeeDee login and ~0.3 MB per MyCourseVille
  # one, so even 24 each is only ~43 MB on top of a ~80 MB baseline. The limit is
  # MyCourseVille itself: at 16 it serves a 24-user class in ~4.5s, and at 24 it
  # throttles hard — measured 44s then 58s on consecutive runs, with even the
  # fastest login going from 0.5s to 4.6s. login() retries 3x at a 30s timeout,
  # so once MCV stalls, one login compounds into a minute. ClassDeeDee showed no
  # such effect (unchanged at ~3s), but it shares this setting.
  CHECKIN_CONCURRENCY = '16'
  # Public base URL the /scanner command hands out. Not a secret — the token
  # is appended as a URL fragment at DM time.
  SCAN_BASE_URL = 'https://chula-attendance-bot.fly.dev'

[mounts]
  source = 'bot_data'
  destination = '/data'

# QR scanner page. auto_stop must stay off — this machine is a long-lived
# Discord gateway client, not a request-driven web app.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = 256
